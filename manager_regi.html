<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: #eaf0f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .register-box {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .register-box h1 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #14334d;
        }

        .register-box p.subtitle {
            margin: 0 0 25px 0;
            text-align: center;
            color: #64748b;
        }

        .register-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #14334d;
        }

        .register-box input[type="text"],
        .register-box input[type="password"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .register-box input[type="text"]:focus,
        .register-box input[type="password"]:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* Gender radio buttons */
        .gender-row {
            display: flex;
            gap: 25px;
            margin-bottom: 18px;
        }

        .gender-row label,
        .terms-row label {
            display: inline;
            font-weight: normal;
            color: #333;
        }

        .gender-row input,
        .terms-row input {
            margin-right: 6px;
        }

        .terms-row {
            margin-bottom: 15px;
        }

        #error {
            color: #dc2626;
            margin: 0 0 15px 0;
            min-height: 18px;
            font-size: 14px;
        }

        .register-box button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .register-box button:hover {
            background: #1d4ed8;
        }

        .login-links {
            display: flex;
            justify-content: center;
            margin-top: 22px;
        }

        .login-links a {
            color: #2563eb;
            text-decoration: none;
            font-size: 17px;
        }

        .login-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>Manager Registration</h1>
        <p class="subtitle">Create your account for the Hostel Management System.</p>

        <form onsubmit="return validateForm()">

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name">

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email">

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter 11 digit phone number">

            <label>Gender</label>
            <div class="gender-row">
                <span><input type="radio" name="gender" id="male"><label for="male">Male</label></span>
                <span><input type="radio" name="gender" id="female"><label for="female">Female</label></span>
                <span><input type="radio" name="gender" id="other"><label for="other">Other</label></span>
            </div>

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Enter your password again">

            <div class="terms-row">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the Terms and Conditions</label>
            </div>

            <!-- Error message appears here -->
            <p id="error"></p>

            <button type="submit">Register</button>

        </form>

        <div class="login-links">
            <a href="ml.html">Back to Login</a>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
