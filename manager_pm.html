
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .management-form {
            background: #fff;
            padding: 30px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .management-form h2,
        .records-section h2 {
            text-align: center;
            color: #14334d;
            margin-bottom: 25px;
        }

        .payment-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #263747;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input[readonly] {
            background: #eef2f7;
        }

        .payment-buttons {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .payment-buttons button {
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .payment-buttons button:hover {
            background: #1749b5;
        }

        #paymentMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        #paymentMessage:empty {
            display: none;
        }

        #paymentMessage.success {
            background: #dcfce7;
            color: #166534;
        }

        #paymentMessage.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .records-section {
            margin-top: 25px;
            padding: 25px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
            scroll-margin-top: 20px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .payment-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .payment-table th,
        .payment-table td {
            border: 1px solid #ddd;
            padding: 12px 10px;
            text-align: left;
            white-space: nowrap;
        }

        .payment-table th {
            background: #14334d;
            color: white;
        }

        .payment-table tbody tr:nth-child(even) {
            background: #f1f5f9;
        }

        .row-button {
            border: none;
            border-radius: 5px;
            padding: 9px 13px;
            margin: 2px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .edit-button {
            background: #0d9488;
        }

        .edit-button:hover {
            background: #0f766e;
        }

        .delete-button {
            background: #dc2626;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        #emptyPayments {
            text-align: center;
            padding: 18px;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .payment-form {
                grid-template-columns: 1fr;
            }

            .payment-buttons {
                grid-column: 1;
                flex-direction: column;
            }

            .management-form,
            .records-section {
                padding: 18px;
            }
        }
    </style>
</head>

<body class="dashboard-body">

    <aside class="sidebar">
        <h2>Hostel Manager</h2>

        <nav>
            <a href="md.html">Dashboard</a>
            <a href="manager_sm.html">Students</a>
            <a href="manager_rm.html">Rooms</a>
            <a href="manager_pm.html" class="active">Payments</a>
        </nav>

        <a href="index.html" class="logout">Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="management-page">

            <header class="management-header">
                <h1>Payment Management</h1>
                <p>Manage student fees and outstanding dues.</p>
            </header>

            <section class="management-form">
                <h2>Payment Information</h2>

                <form id="paymentForm" class="payment-form">

                    <div class="form-group">
                        <label for="payment-id">Payment ID</label>
                        <input
                            type="text"
                            id="payment-id"
                            name="payment_id"
                            placeholder="Enter Payment ID"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="student-id">Student ID</label>
                        <input
                            type="text"
                            id="student-id"
                            name="student_id"
                            placeholder="Enter Student ID"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="student-name">Student Name</label>
                        <input
                            type="text"
                            id="student-name"
                            name="student_name"
                            placeholder="Enter Student Name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="fee-month">Fee Month</label>
                        <input
                            type="month"
                            id="fee-month"
                            name="fee_month"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="total-fee">Total Hostel Fee</label>
                        <input
                            type="number"
                            id="total-fee"
                            name="total_fee"
                            placeholder="Enter Total Hostel Fee"
                            min="0"
                            step="0.01"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="paid-amount">Paid Amount</label>
                        <input
                            type="number"
                            id="paid-amount"
                            name="paid_amount"
                            placeholder="Enter Paid Amount"
                            min="0"
                            step="0.01"
                            value="0"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="due-amount">Due Amount</label>
                        <input
                            type="number"
                            id="due-amount"
                            name="due_amount"
                            placeholder="Due Amount"
                            readonly>
                    </div>

                    <div class="form-group">
                        <label for="payment-date">Payment Date</label>
                        <input
                            type="date"
                            id="payment-date"
                            name="payment_date"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="payment-method">Payment Method</label>
                        <select
                            id="payment-method"
                            name="payment_method"
                            required>
                            <option value="">Select Payment Method</option>
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Mobile Banking">Mobile Banking</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="payment-status">Payment Status</label>
                        <select
                            id="payment-status"
                            name="payment_status"
                            required>
                            <option value="">Select Payment Status</option>
                            <option value="Paid">Paid</option>
                            <option value="Partial">Partial</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                    <div class="payment-buttons">
                        <button type="submit" id="recordPayment">
                            Record Payment
                        </button>

                        <button type="button" id="viewPayments">
                            View Payments
                        </button>
                    </div>
                </form>

                <div id="paymentMessage" role="status" aria-live="polite"></div>
            </section>

            <section
                id="paymentRecordsSection"
                class="records-section"
                hidden>

                <h2>Payment Records</h2>

                <p id="paymentCount"></p>

                <p id="emptyPayments" hidden>
                    No payment records found.
                </p>

                <div class="table-wrapper">
                    <table class="payment-table">
                        <thead>
                            <tr>
                                <th>Payment ID</th>
                                <th>Student ID</th>
                                <th>Student Name</th>
                                <th>Fee Month</th>
                                <th>Total Fee</th>
                                <th>Paid Amount</th>
                                <th>Due Amount</th>
                                <th>Payment Date</th>
                                <th>Method</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="paymentTableBody"></tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

    <script src="main.js" defer></script>
</body>
</html>
