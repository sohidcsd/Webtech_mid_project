<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .management-page { padding: 25px; }

        .management-header {
            background: #14334d;
            color: white;
            text-align: center;
            padding: 30px;
            margin-bottom: 25px;
        }

        .room-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .room-buttons a {
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
        }

        .room-section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        .room-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 20px;
        }

        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 6px; font-weight: bold; }
        .form-group input,
        .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }

        .form-actions { display: flex; gap: 10px; margin-top: 25px; }
        .form-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            background: #2563eb;
            cursor: pointer;
        }
        .form-actions .delete-btn { background: #dc2626; }

        /* Success / error message */
        .success { color: #166534; background: #dcfce7; padding: 10px; border-radius: 5px; margin-top: 15px; }
        .error { color: #991b1b; background: #fee2e2; padding: 10px; border-radius: 5px; margin-top: 15px; }

        /* Room table */
        .room-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .room-table th,
        .room-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .room-table th { background: #14334d; color: white; }

        .row-button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            margin-right: 5px;
        }
        .edit-button { background: #2563eb; }
        .delete-button { background: #dc2626; }
    </style>
</head>

<body class="dashboard-body">

    <aside class="sidebar">
        <h2>Hostel Manager</h2>

        <nav>
            <a href="md.html">Dashboard</a>
            <a href="manager_sm.html">Students</a>
            <a href="manager_rm.html" class="active">Rooms</a>
            <a href="manager_pm.html">Payments</a>
        </nav>

        <a href="index.html" class="logout">Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="management-page">

            <header class="management-header">
                <h1>Room Management</h1>
                <p>Manage room information.</p>
            </header>

            <div class="room-buttons">
                <a href="#manageRooms">Manage Rooms</a>
            </div>

            <!-- MANAGE ROOMS -->
            <section id="manageRooms" class="room-section">
                <h2>Manage Rooms</h2>
                <p>Add, view, update and delete room information.</p>

                <form id="roomForm">
                    <div class="room-form">
                        <div class="form-group">
                            <label for="room_id">Room ID</label>
                            <input type="text" id="room_id" name="room_id" placeholder="Enter Room ID" required>
                        </div>
                        <div class="form-group">
                            <label for="room_number">Room Number</label>
                            <input type="text" id="room_number" name="room_number" placeholder="Enter Room Number" required>
                        </div>
                        <div class="form-group">
                            <label for="building">Building / Block</label>
                            <input type="text" id="building" name="building" placeholder="Enter Building or Block" required>
                        </div>
                        <div class="form-group">
                            <label for="floor_number">Floor Number</label>
                            <input type="number" id="floor_number" name="floor_number" placeholder="Enter Floor Number" required>
                        </div>
                        <div class="form-group">
                            <label for="room_type">Room Type</label>
                            <select id="room_type" name="room_type" required>
                                <option value="">Select Room Type</option>
                                <option>Single</option>
                                <option>Double</option>
                                <option>Triple</option>
                                <option>Shared</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="room_status">Room Status</label>
                            <select id="room_status" name="room_status" required>
                                <option value="">Select Room Status</option>
                                <option>Available</option>
                                <option>Full</option>
                                <option>Maintenance</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="addRoom">Add Room</button>
                        <button type="button" id="viewRooms">View Rooms</button>
                        <button type="button" id="updateRoom">Update Room</button>
                        <button type="button" id="deleteRoom" class="delete-btn">Delete Room</button>
                    </div>

                    <!-- Message appears here -->
                    <p id="roomMessage"></p>
                </form>
            </section>

            <!-- ROOM RECORDS TABLE -->
            <section id="roomRecordsSection" class="room-section" hidden>
                <h2>Room Records</h2>

                <p id="emptyRooms" hidden>No room records found.</p>

                <table class="room-table">
                    <thead>
                        <tr>
                            <th>Room ID</th>
                            <th>Room Number</th>
                            <th>Building / Block</th>
                            <th>Floor</th>
                            <th>Room Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roomTableBody"></tbody>
                </table>
            </section>

        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
